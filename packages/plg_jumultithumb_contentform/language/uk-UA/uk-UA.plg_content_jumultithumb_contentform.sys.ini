PLG_JUMULTITHUMB_CONTENTFORM="Контент — форма JUMultiThumb"
PLG_JUMULTITHUMB_CONTENTFORM_DESCRIPTION="Цей плагін лише додає до форми редагування стандартної статті Joomla вкладку «Водяний знак» із параметрами JUMultiThumb для зображень і галерей статті: вимкнення водяного знака, застосування лише до вступного тексту та налаштування для оригіналів і мініатюр. Сам він не обробляє зображення й не накладає водяні знаки — це виконує основний плагін JUMultiThumb."
PLG_JUMULTITHUMB_CONTENTFORM_XML_DESCRIPTION="Цей плагін лише додає до форми редагування стандартної статті Joomla вкладку «Водяний знак» із параметрами JUMultiThumb для зображень і галерей статті: вимкнення водяного знака, застосування лише до вступного тексту та налаштування для оригіналів і мініатюр. Сам він не обробляє зображення й не накладає водяні знаки — це виконує основний плагін JUMultiThumb."
