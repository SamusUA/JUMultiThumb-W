PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_OFF="Увімкніть цей параметр, щоб не застосовувати водяний знак до зображень цієї статті. Він перевизначає глобальну поведінку для цієї статті, але не видаляє вже створені файли."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_ORIGINAL="Увімкніть великий водяний знак для створюваних повнорозмірних варіантів зображень цієї статті. Основний плагін має бути ввімкнений, а режим великого знака — встановлений у значення для позначених статей і пунктів меню, щоб цей перемикач керував результатом."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_INTRO_ONLY="Якщо ввімкнено, цей параметр забороняє додатковому плагіну галереї накладати водяні знаки на зображення галереї цієї статті. Попри назву поля, поточний обробник зображень вмісту не використовує його, щоб обмежити всі водяні знаки зображень лише вступним текстом."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_SMALL="Увімкніть малий водяний знак для мініатюр цієї статті. Основний плагін має бути ввімкнений, а режим малого знака — встановлений у значення для позначених статей і пунктів меню, щоб цей перемикач керував результатом."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_GALLERY_ORIGINAL="Увімкніть великий водяний знак для повнорозмірних варіантів зображень, створюваних галереєю цієї статті. Основний плагін має бути ввімкнений, а режим великого знака — встановлений для позначених статей і пунктів меню."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_GALLERY_SMALL="Увімкніть малий водяний знак для мініатюр, створюваних галереєю цієї статті. Основний плагін має бути ввімкнений, а режим малого знака — встановлений для позначених статей і пунктів меню."
