PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_OFF="Enable this option to prevent the watermark from being applied to images in this article. It overrides the global watermark behavior for this article but does not remove existing generated files."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_ORIGINAL="Enable the large watermark for this article's generated full-size image variants. The main plugin must be enabled and its large-watermark mode must be set to marked articles and menu items for this per-article switch to control the result."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_INTRO_ONLY="When enabled, this option prevents the companion gallery plugin from applying watermarks to this article's gallery images. Despite the label, the current content-image renderer does not use it to limit all article-image watermarks to the introductory text."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_WATERMARK_SMALL="Enable the small watermark for this article's generated thumbnails. The main plugin must be enabled and its small-watermark mode must be set to marked articles and menu items for this per-article switch to control the result."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_GALLERY_ORIGINAL="Enable the large watermark for full-size image variants generated by this article's gallery. The main plugin must be enabled and its large-watermark mode must be set to marked articles and menu items."
PLG_JUMULTITHUMB_CONTENTFORM_HELP_GALLERY_SMALL="Enable the small watermark for thumbnail variants generated by this article's gallery. The main plugin must be enabled and its small-watermark mode must be set to marked articles and menu items."