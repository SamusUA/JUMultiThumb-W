PLG_JUMULTITHUMB_CONTENTFORM="Content - JUMultiThumb Content Form"
PLG_JUMULTITHUMB_CONTENTFORM_DESCRIPTION="This plugin only adds a “Watermark” tab to Joomla’s standard article-editing form, with JUMultiThumb settings for the article’s images and galleries: disabling watermarks, limiting them to introductory text, and configuring original-image and thumbnail options. It does not process images or apply watermarks itself; that is handled by the main JUMultiThumb plugin."
PLG_JUMULTITHUMB_CONTENTFORM_XML_DESCRIPTION="This plugin only adds a “Watermark” tab to Joomla’s standard article-editing form, with JUMultiThumb settings for the article’s images and galleries: disabling watermarks, limiting them to introductory text, and configuring original-image and thumbnail options. It does not process images or apply watermarks itself; that is handled by the main JUMultiThumb plugin."