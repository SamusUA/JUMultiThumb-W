; Configuration help
PLG_JUMULTITHUMB_HELP_RESALL="Choose Yes to process all eligible images in rendered content; choose No to process only images marked with the juimage class. Add nothumbnail or noimage to an image to exclude it from automatic processing."
PLG_JUMULTITHUMB_HELP_NOIMAGE_CLASS="This legacy field is read by the current renderer but is not used to select or exclude images. Use the documented nothumbnail, noimage, and juimage classes instead."
PLG_JUMULTITHUMB_HELP_QUALITY="Sets the JPEG quality used for generated image derivatives, from lower file size to higher visual quality. Higher values create larger files; 85–90 is a practical starting range."
PLG_JUMULTITHUMB_HELP_FILTER_MODE="Select the color effect applied to generated thumbnails, such as grayscale, sepia, threshold, or a custom color. Choose the no-filter option to leave thumbnail colors unchanged."
PLG_JUMULTITHUMB_HELP_FILTER_STRENGTH="Sets the strength percentage for the custom color effect. This value is used only when the custom-color filter mode is selected."
PLG_JUMULTITHUMB_HELP_FILTER_COLOR="Choose the color used by the custom color effect. It has no effect unless the custom-color filter mode is selected."
PLG_JUMULTITHUMB_HELP_FILTER_THRESHOLD="Sets the threshold value for the threshold image effect. This setting is relevant only when Threshold is selected as the color filter."
PLG_JUMULTITHUMB_HELP_FILTERS_ENABLE="Enable or disable the image-filter pipeline for generated thumbnails. This master switch also controls the sharpening, blur, brightness, and contrast effects below."
PLG_JUMULTITHUMB_HELP_UNSHARP_ENABLE="Turn unsharp-mask sharpening on or off for generated thumbnails. The sharpening parameters below apply only when this option and the master filter switch are enabled."
PLG_JUMULTITHUMB_HELP_UNSHARP_AMOUNT="Controls the strength of unsharp-mask sharpening; the default is 80. Excessive values can create visible halos, so adjust in small steps."
PLG_JUMULTITHUMB_HELP_UNSHARP_RADIUS="Controls how many neighboring pixels are considered by the sharpening filter; the default is 1. Larger radii produce a broader, stronger-looking effect."
PLG_JUMULTITHUMB_HELP_UNSHARP_THRESHOLD="Sets the minimum tonal difference needed before sharpening is applied; the default is 3. Increasing it can reduce sharpening in smooth areas."
PLG_JUMULTITHUMB_HELP_BLUR_ENABLE="Turn the blur effect on or off for generated thumbnails. It runs only when the master filter switch is enabled."
PLG_JUMULTITHUMB_HELP_BLUR_AMOUNT="Sets the blur strength; the default is 1 and larger values create a heavier blur. Use a small value when you only want to soften fine detail."
PLG_JUMULTITHUMB_HELP_BRIGHTNESS_ENABLE="Turn the brightness adjustment on or off for generated thumbnails. It runs only when the master filter switch is enabled."
PLG_JUMULTITHUMB_HELP_BRIGHTNESS_AMOUNT="Sets the brightness adjustment value, with 50 as the default. Change it gradually and preview the result because large adjustments can wash out image detail."
PLG_JUMULTITHUMB_HELP_CONTRAST_ENABLE="Turn the contrast adjustment on or off for generated thumbnails. It runs only when the master filter switch is enabled."
PLG_JUMULTITHUMB_HELP_CONTRAST_AMOUNT="Sets the contrast adjustment value, with 50 as the default. Change it gradually and preview the result because strong contrast can hide detail in shadows or highlights."
PLG_JUMULTITHUMB_HELP_WATERMARK_ENABLE="Enable the watermark feature before configuring the image and placement options below. Disabling it stops watermark composition on newly generated image variants without changing uploaded source files."
PLG_JUMULTITHUMB_HELP_WATERMARK_FILE="Choose a local watermark image through Joomla Media Manager; a transparent PNG is suitable for most logos. The plugin overlays it on generated variants and does not edit the selected watermark file or uploaded originals."
PLG_JUMULTITHUMB_HELP_WATERMARK_ORIGINAL="Choose whether to apply the large watermark to generated full-size image variants: No, all eligible images, or only marked articles and menu items. The per-article controls are used only with the marked-items mode, and this setting is independent of the small-thumbnail watermark option."
PLG_JUMULTITHUMB_HELP_WATERMARK_SMALL="Choose whether to apply the small watermark to generated thumbnails: No, all eligible images, or only marked articles and menu items. The per-article controls are used only with the marked-items mode, independently of the large watermark option."
PLG_JUMULTITHUMB_HELP_WATERMARK_POSITION="Select the anchor point used to place the watermark within the generated image. The X and Y margins below offset it from that anchor."
PLG_JUMULTITHUMB_HELP_WATERMARK_OPACITY="Sets watermark opacity as a percentage, where 100 is fully opaque and lower values are more transparent. The default is 75; preview the image to choose a legible but unobtrusive value."
PLG_JUMULTITHUMB_HELP_WATERMARK_MARGIN_X="Sets the horizontal watermark offset in pixels from its selected anchor. Positive margins move it inward from the left or right edge."
PLG_JUMULTITHUMB_HELP_WATERMARK_MARGIN_Y="Sets the vertical watermark offset in pixels from its selected anchor. Positive margins move it inward from the top or bottom edge."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_ENABLE="Enable this option to attach the selected lightbox behavior to eligible image links. When disabled, the image can still be displayed and linked, but the plugin will not initialize a lightbox for it."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_TYPE="Select the lightbox implementation to use for image links, including PhotoSwipe, LightGallery, or custom JavaScript. The selected library must be available in the packaged plugin assets or supplied by the custom-code option."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_JQUERY="Choose Yes only if the selected custom lightbox code requires Joomla's jQuery framework. Leave it disabled when your code does not use jQuery to avoid loading an unnecessary dependency."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_CUSTOMJS="Enter the custom JavaScript or stylesheet initialization code used by the custom lightbox option. This code is emitted on the page, so enter trusted code and ensure it targets the generated image links."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_CUSTOMJS_LABEL="Paste the trusted custom lightbox initialization code here, including any required selectors and options. This field is used only when Custom JavaScript is selected and the lightbox is enabled."
PLG_JUMULTITHUMB_HELP_FIRST_IMAGE="When enabled, the configured link/lightbox behavior is limited to the first image in the introductory text. Other images in that text are not given the same link behavior by this option."
PLG_JUMULTITHUMB_HELP_ONLY_IMAGE_BLOG="When enabled, the blog layout is configured to show the image without the introductory text. The image's thumbnail and link settings remain controlled by their respective fields."
PLG_JUMULTITHUMB_HELP_ONLY_IMAGE_CATEGORY="When enabled, the category layout is configured to show the image without the introductory text. The image's thumbnail and link settings remain controlled by their respective fields."
PLG_JUMULTITHUMB_HELP_LEGACY_WIDTH="This is a legacy per-view width override for Blog, Category, or menu-item settings. The current renderer does not read these override values, so changing them does not change generated thumbnail dimensions."
PLG_JUMULTITHUMB_HELP_LEGACY_HEIGHT="This is a legacy per-view height override for Blog, Category, or menu-item settings. The current renderer does not read these override values, so changing them does not change generated thumbnail dimensions."
PLG_JUMULTITHUMB_HELP_LEGACY_NORESIZE="This legacy per-view switch was intended to bypass thumbnail resizing. The current renderer does not read this Blog, Category, or menu-item override, so it has no effect on output."
PLG_JUMULTITHUMB_HELP_LEGACY_NOFULLIMG="This legacy per-view switch was intended to suppress the link to a full-size image. The current renderer does not read this Blog, Category, or menu-item override, so it has no effect on output."
PLG_JUMULTITHUMB_HELP_LEGACY_AOE="This legacy option was intended to allow a thumbnail larger than its source image. Its Blog, Category, and menu-item values are not consumed by the current renderer."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP="This legacy per-view option was intended to enable Zoom-Crop for Blog, Category, or menu-item images. The current renderer does not read these override values; use the active Article image crop settings instead."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP_POSITION="This legacy field stores a Zoom-Crop anchor for a view-specific override. The current renderer does not read the Blog, Category, or menu-item value, so changing it does not change crop position."
PLG_JUMULTITHUMB_HELP_LEGACY_AUTO_CROP="This legacy per-view control was intended to select automatic crop or fill behavior. The current renderer does not consume these Blog, Category, or menu-item values."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP_ASPECT="This legacy field stores a target aspect ratio for view-specific Zoom-Crop. Its Blog, Category, and menu-item values are not read by the current renderer."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP_BACKGROUND="This legacy field stores a fill color for a view-specific Zoom-Crop operation. The current renderer does not consume the Blog, Category, or menu-item value."
PLG_JUMULTITHUMB_HELP_LEGACY_FARCROP="This legacy view-specific option was intended to control fixed-frame sizing. The current Blog, Category, and menu-item renderer does not consume this setting; the active Article farcrop option now enables a CSS mask instead."
PLG_JUMULTITHUMB_HELP_LEGACY_FARCROP_POSITION="This legacy field stores an alignment for the older far-crop behavior. The current renderer does not read this Blog, Category, or menu-item value, and the CSS mask is centered."
PLG_JUMULTITHUMB_HELP_LEGACY_FARCROP_BACKGROUND="This legacy field stores a background color for the older far-crop behavior. It is not consumed by the current Blog, Category, or menu-item renderer and does not color the CSS mask."
PLG_JUMULTITHUMB_HELP_LEGACY_SX="This legacy field stores a horizontal crop offset in pixels. The current renderer does not read the Blog or Category override, so changing this value does not move the crop."
PLG_JUMULTITHUMB_HELP_LEGACY_SY="This legacy field stores a vertical crop offset in pixels. The current renderer does not read the Blog or Category override, so changing this value does not move the crop."
PLG_JUMULTITHUMB_HELP_LEGACY_MAXSIZE="This legacy switch was intended to limit the dimensions of full-size image variants. The current renderer does not consume the Category or menu-item value."
PLG_JUMULTITHUMB_HELP_LEGACY_MAXWIDTH="This legacy field stores a maximum width for a full-size image variant. The current renderer does not read the Category or menu-item override."
PLG_JUMULTITHUMB_HELP_LEGACY_MAXHEIGHT="This legacy field stores a maximum height for a full-size image variant. The current renderer does not read the Category or menu-item override."
PLG_JUMULTITHUMB_HELP_LEGACY_WATERMARK="This legacy menu-item option was intended to override the large watermark setting for selected pages. The current renderer does not read this per-menu value; configure the active Watermark settings instead."
PLG_JUMULTITHUMB_HELP_LEGACY_WATERMARK_SMALL="This legacy menu-item option was intended to override the small-thumbnail watermark setting for selected pages. The current renderer does not read this per-menu value."
PLG_JUMULTITHUMB_HELP_ARTICLE_NORESIZE="This option is intended to leave inline article images at their original size. The current inline-image renderer still creates a thumbnail variant, so do not rely on this control to bypass image processing."
PLG_JUMULTITHUMB_HELP_ARTICLE_IMAGE_NORESIZE="When enabled, the selected Joomla intro or full-text image is displayed at its source dimensions rather than using the configured thumbnail dimensions. This does not edit the source file."
PLG_JUMULTITHUMB_HELP_ARTICLE_NOFULLIMG="When enabled, the generated image is not linked to its full-size variant. This is useful when the image should remain static instead of opening in a lightbox."
PLG_JUMULTITHUMB_HELP_WIDTH="Sets the target maximum width, in pixels, for the generated thumbnail. The image keeps its proportions unless the selected crop mode specifies a fixed frame."
PLG_JUMULTITHUMB_HELP_HEIGHT="Sets the target maximum height, in pixels, for the generated thumbnail. The image keeps its proportions unless the selected crop mode specifies a fixed frame."
PLG_JUMULTITHUMB_HELP_CROP_MODE="Select the Zoom-Crop mode used to produce the thumbnail. The mode controls how the image fits or crops to the requested dimensions; it does not modify the uploaded source."
PLG_JUMULTITHUMB_HELP_AUTO_CROP="This legacy control is passed to the image helper as a Zoom-Crop background value, not as an independent crop-mode selector. Its effect depends on the selected crop mode and it does not enable CSS masking."
PLG_JUMULTITHUMB_HELP_CROP_ASPECT="Sets the target aspect ratio used by the supported Zoom-Crop mode. This value affects thumbnail generation only when the selected crop mode consumes an aspect ratio."
PLG_JUMULTITHUMB_HELP_CROP_BACKGROUND="Sets the background value passed to JUImage for crop modes that use a fill color. It does not change the source file and has no effect on the centered CSS mask."
PLG_JUMULTITHUMB_HELP_CSS_MASK="Any nonzero value enables a centered CSS mask around the thumbnail using the configured frame dimensions. The generated thumbnail keeps its original proportions and the frame scales down responsively; alignment choices do not move the mask, and the linked full-size image remains unchanged."
PLG_JUMULTITHUMB_HELP_CSS_MASK_BACKGROUND="The CSS mask is transparent and does not use a background color. This legacy value is retained for compatibility with image-helper settings and does not color the masked frame."
PLG_JUMULTITHUMB_HELP_MENU_ITEMS="Add a row to define legacy image overrides for a menu item. These saved rows are not consumed by the current renderer, so they do not change output in this release."
PLG_JUMULTITHUMB_HELP_MENU_VIEW="Select the Joomla view for which this legacy override row was intended. The current renderer does not apply the per-menu override values."
PLG_JUMULTITHUMB_HELP_MENU_SELECTION="Choose one or more menu items for the legacy override row. The current renderer does not consume these selections or their associated image settings."
PLG_JUMULTITHUMB_IMAGE_FAR_MASK="Visual crop mask (CSS; source file is not cropped)"