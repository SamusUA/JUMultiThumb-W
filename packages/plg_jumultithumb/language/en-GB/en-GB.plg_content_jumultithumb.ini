PLG_JUMULTITHUMB_DESCRIPTION="<p>The package history credits original work to Denys Nosov and Joomla! Ukraine and carries copyright notices dating to 2007. The project materials link to <a href='https://joomla-ua.org' target='_blank' rel='noopener'>Joomla! Ukraine</a>, and the package lists <a href='https://webus.in.ua' target='_blank' rel='noopener'>Studio WEBUS</a> as its author site.</p><p>JUMultiThumb is a Joomla extension for preparing article images for display at different sizes. It creates thumbnail variants and can connect eligible image links to a lightbox. The extension is intended to help sites present image-rich articles and galleries consistently.</p><p>On rendered pages, the content plugin processes eligible images according to the active settings and creates cached derivatives instead of overwriting uploaded originals. It can resize thumbnails, apply supported image effects, and add configured watermarks to generated variants. Article images can use an HTML/CSS mask that preserves the thumbnail file's proportions while hiding overflow inside a centered frame. Joomla intro and full-text images have separate settings, and their placement can be configured independently. Optional lightbox integrations display linked images in an overlay, while the companion gallery plugin creates folder-based galleries and provides an editor button for inserting gallery tags. The current release is maintained by Samuswebus.</p>"

