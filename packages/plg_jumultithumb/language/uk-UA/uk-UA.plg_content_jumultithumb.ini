PLG_JUMULTITHUMB_DESCRIPTION="<p>Історія пакета вказує на авторство первинної розробки Дениса Носова та Joomla! Ukraine, а повідомлення про авторські права датуються 2007 роком. У матеріалах проєкту є посилання на <a href='https://joomla-ua.org' target='_blank' rel='noopener'>Joomla! Ukraine</a>, а в метаданих пакета сайтом автора вказано <a href='https://webus.in.ua' target='_blank' rel='noopener'>Studio WEBUS</a>. Подальша розробка триває під авторським ім’ям Samuswebus.</p><p>JUMultiThumb — розширення Joomla для підготовки зображень статей до показу в різних розмірах. Воно створює варіанти мініатюр і може пов’язувати відповідні зображення з лайтбоксом. Розширення допомагає послідовно оформлювати статті та галереї з багатьма зображеннями.</p><p>Під час формування сторінки плагін обробляє відповідні зображення згідно з активними параметрами та створює кешовані похідні файли, не перезаписуючи завантажені оригінали. Він може змінювати розмір мініатюр, застосовувати підтримувані ефекти та накладати налаштовані водяні знаки на створені варіанти. Для зображень статті можна ввімкнути HTML/CSS-маску, яка зберігає пропорції файла мініатюри та приховує виступаючі частини всередині центрованого кадру. Для основних зображень вступу й повного тексту Joomla передбачені окремі параметри та місце розташування. Необов’язкові інтеграції лайтбоксу відкривають зображення поверх сторінки, а додатковий плагін галереї створює галереї з тек і додає кнопку для вставлення їхніх тегів у редакторі. Автор: Samuswebus.</p>"
