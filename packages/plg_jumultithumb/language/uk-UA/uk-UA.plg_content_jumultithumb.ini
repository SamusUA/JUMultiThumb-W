; Підказки до параметрів
PLG_JUMULTITHUMB_HELP_RESALL="Виберіть «Так», щоб обробляти всі відповідні зображення у вмісті сторінки; виберіть «Ні», щоб обробляти лише зображення з класом juimage. Щоб виключити окреме зображення з автоматичної обробки, додайте до нього клас nothumbnail або noimage."
PLG_JUMULTITHUMB_HELP_NOIMAGE_CLASS="Це застаріле поле читається поточним кодом, але не використовується для вибору чи виключення зображень. Натомість використовуйте документовані класи nothumbnail, noimage та juimage."
PLG_JUMULTITHUMB_HELP_QUALITY="Визначає якість JPEG для створених варіантів зображень: нижче значення зменшує файл, а вище — зберігає більше візуальних деталей. Вищі значення створюють більші файли; практичний початковий діапазон — 85–90."
PLG_JUMULTITHUMB_HELP_FILTER_MODE="Виберіть кольоровий ефект для створених мініатюр: відтінки сірого, сепію, пороговий ефект або власний колір. Щоб залишити кольори без змін, виберіть режим без фільтра."
PLG_JUMULTITHUMB_HELP_FILTER_STRENGTH="Визначає силу ефекту власного кольору у відсотках. Значення використовується лише тоді, коли вибрано режим власного кольору."
PLG_JUMULTITHUMB_HELP_FILTER_COLOR="Виберіть колір для ефекту власного кольору. Цей параметр не впливає на зображення, якщо не вибрано відповідний режим фільтра."
PLG_JUMULTITHUMB_HELP_FILTER_THRESHOLD="Визначає порогове значення для порогового ефекту зображення. Параметр має значення лише тоді, коли як кольоровий фільтр вибрано Threshold."
PLG_JUMULTITHUMB_HELP_FILTERS_ENABLE="Увімкніть або вимкніть конвеєр фільтрів для створюваних мініатюр. Цей головний перемикач також керує ефектами різкості, розмиття, яскравості та контрасту нижче."
PLG_JUMULTITHUMB_HELP_UNSHARP_ENABLE="Увімкніть або вимкніть підвищення різкості методом Unsharp Mask для мініатюр. Параметри нижче діють лише тоді, коли цей перемикач і головний перемикач фільтрів увімкнені."
PLG_JUMULTITHUMB_HELP_UNSHARP_AMOUNT="Визначає силу підвищення різкості методом Unsharp Mask; типове значення — 80. Надто високе значення може створювати помітні світлі контури, тому змінюйте його поступово."
PLG_JUMULTITHUMB_HELP_UNSHARP_RADIUS="Визначає кількість сусідніх пікселів, які враховує фільтр різкості; типове значення — 1. Більший радіус створює ширший і виразніший ефект."
PLG_JUMULTITHUMB_HELP_UNSHARP_THRESHOLD="Визначає мінімальну різницю тону, за якої застосовується підвищення різкості; типове значення — 3. Збільшення порога може зменшити ефект на однорідних ділянках."
PLG_JUMULTITHUMB_HELP_BLUR_ENABLE="Увімкніть або вимкніть розмиття створюваних мініатюр. Ефект працює лише тоді, коли увімкнено головний перемикач фільтрів."
PLG_JUMULTITHUMB_HELP_BLUR_AMOUNT="Визначає силу розмиття: типове значення 1 дає легкий ефект, а більші значення — сильніше розмиття. Використовуйте невелике значення, якщо потрібно лише пом’якшити дрібні деталі."
PLG_JUMULTITHUMB_HELP_BRIGHTNESS_ENABLE="Увімкніть або вимкніть коригування яскравості створюваних мініатюр. Ефект працює лише тоді, коли увімкнено головний перемикач фільтрів."
PLG_JUMULTITHUMB_HELP_BRIGHTNESS_AMOUNT="Визначає значення коригування яскравості; типове значення — 50. Змінюйте його поступово й переглядайте результат, оскільки сильне коригування може втратити деталі."
PLG_JUMULTITHUMB_HELP_CONTRAST_ENABLE="Увімкніть або вимкніть коригування контрасту створюваних мініатюр. Ефект працює лише тоді, коли увімкнено головний перемикач фільтрів."
PLG_JUMULTITHUMB_HELP_CONTRAST_AMOUNT="Визначає значення коригування контрасту; типове значення — 50. Змінюйте його поступово й переглядайте результат, оскільки надмірний контраст приховує деталі у світлих або темних ділянках."
PLG_JUMULTITHUMB_HELP_WATERMARK_ENABLE="Увімкніть функцію водяного знака, перш ніж налаштовувати зображення та його розміщення нижче. Вимкнення припиняє накладання знака на нові варіанти зображень і не змінює завантажені оригінали."
PLG_JUMULTITHUMB_HELP_WATERMARK_FILE="Виберіть локальний файл водяного знака через Медіаменеджер Joomla; для логотипів зазвичай підходить прозорий PNG. Плагін накладає його на створені варіанти й не змінює ані файл знака, ані завантажені оригінали."
PLG_JUMULTITHUMB_HELP_WATERMARK_ORIGINAL="Виберіть, чи додавати великий водяний знак до повнорозмірних варіантів: ні, до всіх відповідних зображень або лише до позначених статей і пунктів меню. Параметри окремої статті діють лише в режимі позначених елементів і не залежать від налаштування малого знака для мініатюр."
PLG_JUMULTITHUMB_HELP_WATERMARK_SMALL="Виберіть, чи додавати малий водяний знак до мініатюр: ні, до всіх відповідних зображень або лише до позначених статей і пунктів меню. Параметри окремої статті діють лише в режимі позначених елементів і не залежать від великого водяного знака."
PLG_JUMULTITHUMB_HELP_WATERMARK_POSITION="Виберіть точку прив’язки для розміщення водяного знака на створеному зображенні. Відступи X і Y нижче зміщують його відносно цієї точки."
PLG_JUMULTITHUMB_HELP_WATERMARK_OPACITY="Визначає непрозорість водяного знака у відсотках: 100 — повністю непрозорий, менше значення — прозоріший. Типове значення — 75; перевірте результат, щоб знак був помітним, але не надто нав’язливим."
PLG_JUMULTITHUMB_HELP_WATERMARK_MARGIN_X="Визначає горизонтальне зміщення водяного знака в пікселях від вибраної точки прив’язки. Додатний відступ переміщує знак усередину від лівого або правого краю."
PLG_JUMULTITHUMB_HELP_WATERMARK_MARGIN_Y="Визначає вертикальне зміщення водяного знака в пікселях від вибраної точки прив’язки. Додатний відступ переміщує знак усередину від верхнього або нижнього краю."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_ENABLE="Увімкніть цей параметр, щоб застосовувати вибрану поведінку лайтбоксу до відповідних посилань на зображення. Якщо його вимкнути, плагін не запускатиме лайтбокс, хоча зображення може залишатися видимим і посилатися на файл."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_TYPE="Виберіть лайтбокс для зображень. Застаріле значення LightGallery використовує PhotoSwipe для сумісності, а не бібліотеку lightGallery. Власний JavaScript потрібно додати окремо."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_JQUERY="Виберіть «Так» лише тоді, коли власний код лайтбоксу потребує jQuery. Якщо код його не використовує, залиште перемикач вимкненим, щоб не завантажувати зайву залежність."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_CUSTOMJS="Введіть власний JavaScript або код ініціалізації таблиці стилів для варіанта Custom JavaScript. Цей код додається на сторінку, тому вводьте лише довірений код і перевірте, що він працює зі створеними посиланнями на зображення."
PLG_JUMULTITHUMB_HELP_LIGHTBOX_CUSTOMJS_LABEL="Вставте сюди довірений код ініціалізації власного лайтбоксу, включно з потрібними селекторами та параметрами. Поле використовується лише тоді, коли увімкнено лайтбокс і вибрано Custom JavaScript."
PLG_JUMULTITHUMB_HELP_FIRST_IMAGE="Якщо ввімкнено, налаштоване посилання або лайтбокс застосовується лише до першого зображення у вступному тексті. Цей параметр не додає таку саму поведінку до решти зображень цього тексту."
PLG_JUMULTITHUMB_HELP_ONLY_IMAGE_BLOG="Якщо ввімкнено, у макеті блогу налаштовується показ зображення без вступного тексту. Параметри мініатюри та посилання на зображення задаються окремо."
PLG_JUMULTITHUMB_HELP_ONLY_IMAGE_CATEGORY="Якщо ввімкнено, у макеті категорії налаштовується показ зображення без вступного тексту. Параметри мініатюри та посилання на зображення задаються окремо."
PLG_JUMULTITHUMB_HELP_LEGACY_WIDTH="Це застаріле перевизначення ширини для блогу, категорії або пункту меню. Поточний обробник не читає ці значення, тому їх зміна не впливає на розміри створених мініатюр."
PLG_JUMULTITHUMB_HELP_LEGACY_HEIGHT="Це застаріле перевизначення висоти для блогу, категорії або пункту меню. Поточний обробник не читає ці значення, тому їх зміна не впливає на розміри створених мініатюр."
PLG_JUMULTITHUMB_HELP_LEGACY_NORESIZE="Цей застарілий перемикач для окремого макета мав вимикати зміну розміру мініатюр. Поточний обробник не читає перевизначення блогу, категорії чи пункту меню, тому воно не впливає на результат."
PLG_JUMULTITHUMB_HELP_LEGACY_NOFULLIMG="Цей застарілий перемикач для окремого макета мав вимикати посилання на повнорозмірне зображення. Поточний обробник не читає перевизначення блогу, категорії чи пункту меню, тому воно не впливає на результат."
PLG_JUMULTITHUMB_HELP_LEGACY_AOE="Цей застарілий параметр мав дозволяти мініатюру, більшу за вихідне зображення. Поточний обробник не використовує його значення для блогу, категорії чи пункту меню."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP="Цей застарілий параметр мав вмикати Zoom-Crop для зображень блогу, категорії або пункту меню. Поточний обробник не читає ці перевизначення; натомість використовуйте активні параметри кадрування зображень статті."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP_POSITION="Це застаріле поле зберігає точку прив’язки для перевизначення Zoom-Crop. Поточний обробник не читає значення блогу, категорії чи пункту меню, тому його зміна не впливає на позицію кадрування."
PLG_JUMULTITHUMB_HELP_LEGACY_AUTO_CROP="Цей застарілий параметр окремого макета призначався для автоматичного кадрування або заповнення. Поточний обробник не використовує значення блогу, категорії чи пункту меню."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP_ASPECT="Це застаріле поле зберігає співвідношення сторін для Zoom-Crop окремого макета. Поточний обробник не читає значення блогу, категорії чи пункту меню."
PLG_JUMULTITHUMB_HELP_LEGACY_CROP_BACKGROUND="Це застаріле поле зберігає колір заповнення для Zoom-Crop окремого макета. Поточний обробник не використовує значення блогу, категорії чи пункту меню."
PLG_JUMULTITHUMB_HELP_LEGACY_FARCROP="Цей застарілий параметр окремого макета призначався для фіксованого кадру. Поточний обробник блогу, категорії та пунктів меню його не використовує; активний параметр farcrop у статті натомість вмикає CSS-маску."
PLG_JUMULTITHUMB_HELP_LEGACY_FARCROP_POSITION="Це застаріле поле зберігає вирівнювання для попередньої поведінки far-crop. Поточний обробник не читає значення блогу, категорії чи пункту меню, а CSS-маска вирівнюється по центру."
PLG_JUMULTITHUMB_HELP_LEGACY_FARCROP_BACKGROUND="Це застаріле поле зберігає колір тла для попередньої поведінки far-crop. Поточний обробник блогу, категорії та пунктів меню його не використовує, і воно не задає колір CSS-маски."
PLG_JUMULTITHUMB_HELP_LEGACY_SX="Це застаріле поле зберігає горизонтальний зсув кадрування у пікселях. Поточний обробник не читає перевизначення блогу чи категорії, тому значення не змінює позицію кадру."
PLG_JUMULTITHUMB_HELP_LEGACY_SY="Це застаріле поле зберігає вертикальний зсув кадрування у пікселях. Поточний обробник не читає перевизначення блогу чи категорії, тому значення не змінює позицію кадру."
PLG_JUMULTITHUMB_HELP_LEGACY_MAXSIZE="Цей застарілий перемикач призначався для обмеження розмірів повнорозмірних варіантів зображень. Поточний обробник не використовує значення категорії чи пункту меню."
PLG_JUMULTITHUMB_HELP_LEGACY_MAXWIDTH="Це застаріле поле зберігає максимальну ширину повнорозмірного варіанта зображення. Поточний обробник не читає перевизначення категорії чи пункту меню."
PLG_JUMULTITHUMB_HELP_LEGACY_MAXHEIGHT="Це застаріле поле зберігає максимальну висоту повнорозмірного варіанта зображення. Поточний обробник не читає перевизначення категорії чи пункту меню."
PLG_JUMULTITHUMB_HELP_LEGACY_WATERMARK="Цей застарілий параметр пункту меню мав перевизначати великий водяний знак для вибраних сторінок. Поточний обробник не читає це значення; налаштовуйте активні параметри водяного знака."
PLG_JUMULTITHUMB_HELP_LEGACY_WATERMARK_SMALL="Цей застарілий параметр пункту меню мав перевизначати малий водяний знак для мініатюр вибраних сторінок. Поточний обробник не читає це значення."
PLG_JUMULTITHUMB_HELP_ARTICLE_NORESIZE="Цей параметр призначений для показу вбудованих зображень статті без зміни вихідного розміру. Поточний обробник вбудованих зображень усе одно створює варіант мініатюри, тому не покладайтеся на нього як на спосіб вимкнути обробку."
PLG_JUMULTITHUMB_HELP_ARTICLE_IMAGE_NORESIZE="Якщо ввімкнено, вибране зображення вступу або повного тексту Joomla показується у вихідних розмірах замість заданих розмірів мініатюри. Файл-оригінал не змінюється."
PLG_JUMULTITHUMB_HELP_ARTICLE_NOFULLIMG="Якщо ввімкнено, до створеного зображення не додається посилання на повнорозмірний варіант. Це доречно, коли зображення має залишатися статичним, а не відкриватися у лайтбоксі."
PLG_JUMULTITHUMB_HELP_WIDTH="Задає максимальну цільову ширину створеної мініатюри у пікселях. Пропорції зображення зберігаються, якщо вибраний режим кадрування не задає фіксований кадр."
PLG_JUMULTITHUMB_HELP_HEIGHT="Задає максимальну цільову висоту створеної мініатюри у пікселях. Пропорції зображення зберігаються, якщо вибраний режим кадрування не задає фіксований кадр."
PLG_JUMULTITHUMB_HELP_CROP_MODE="Виберіть режим Zoom-Crop для створення мініатюри. Він визначає, як зображення вписується або кадрується до заданого розміру, і не змінює завантажений оригінал."
PLG_JUMULTITHUMB_HELP_AUTO_CROP="Цей застарілий параметр передається обробнику зображень як значення тла Zoom-Crop, а не як незалежний вибір режиму кадрування. Його дія залежить від вибраного режиму, і він не вмикає CSS-маску."
PLG_JUMULTITHUMB_HELP_CROP_ASPECT="Задає цільове співвідношення сторін для підтримуваного режиму Zoom-Crop. Значення впливає на створення мініатюри лише тоді, коли вибраний режим кадрування використовує співвідношення сторін."
PLG_JUMULTITHUMB_HELP_CROP_BACKGROUND="Задає значення тла, яке передається JUImage для режимів кадрування із заповненням кольором. Воно не змінює вихідний файл і не впливає на центровану CSS-маску."
PLG_JUMULTITHUMB_HELP_CSS_MASK="Будь-яке ненульове значення вмикає центровану CSS-маску з розмірами кадру з відповідних полів. Файл мініатюри зберігає пропорції, кадр адаптивно зменшується, а варіанти вирівнювання не зміщують маску; повнорозмірне зображення за посиланням не змінюється."
PLG_JUMULTITHUMB_HELP_CSS_MASK_BACKGROUND="CSS-маска прозора й не використовує колір тла. Це застаріле значення збережене для сумісності з параметрами обробника зображень і не задає колір маскованого кадру."
PLG_JUMULTITHUMB_HELP_MENU_ITEMS="Додайте рядок для застарілих перевизначень зображень у пункті меню. Поточний обробник не читає збережені рядки, тому вони не змінюють результат у цьому випуску."
PLG_JUMULTITHUMB_HELP_MENU_VIEW="Виберіть тип подання Joomla, для якого призначався цей застарілий рядок перевизначень. Поточний обробник не застосовує значення окремих пунктів меню."
PLG_JUMULTITHUMB_HELP_MENU_SELECTION="Виберіть один або кілька пунктів меню для застарілого рядка перевизначень. Поточний обробник не використовує вибрані пункти та пов’язані з ними параметри зображень."
PLG_JUMULTITHUMB_IMAGE_FAR_MASK="Візуальна маска (CSS; файл не обрізається)"
