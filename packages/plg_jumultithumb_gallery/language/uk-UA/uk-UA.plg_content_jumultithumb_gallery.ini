PLG_JUMULTITHUMB_GALLERY_HELP_THUMB_WIDTH="Задає максимальну ширину мініатюр галереї у пікселях. Параметр кадрування нижче визначає, чи буде зображення обрізане до заданого кадру."
PLG_JUMULTITHUMB_GALLERY_HELP_THUMB_HEIGHT="Задає максимальну висоту мініатюр галереї у пікселях. Параметр кадрування нижче визначає, чи буде зображення обрізане до заданого кадру."
PLG_JUMULTITHUMB_GALLERY_HELP_THUMB_CROP="Виберіть «Так», щоб обрізати мініатюри галереї до заданої ширини й висоти; виберіть «Ні», щоб зберегти пропорції зображення. Файли оригіналів галереї не змінюються."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER="Виберіть теку в каталозі images Joomla, що містить зображення галереї. Тег галереї у статті має вказувати на потрібну теку."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER_WIDTH="Задає максимальну ширину мініатюр, створюваних із вибраної теки галереї, у пікселях. Виберіть значення, що відповідає макету галереї сайту."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER_HEIGHT="Задає максимальну висоту мініатюр, створюваних із вибраної теки галереї, у пікселях. Виберіть значення, що відповідає макету галереї сайту."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER_CROP="Виберіть, чи обрізати мініатюри галереї з теки до заданих розмірів, чи зберігати пропорції оригіналів. Це впливає лише на мініатюри, а не на вихідні файли."
PLG_JUMULTITHUMB_GALLERY_HELP_TITLE="Задає типовий заголовок елементів галереї, якщо тег галереї у статті не містить власного заголовка. Заголовок у тезі окремої галереї перевизначає це значення."
PLG_JUMULTITHUMB_GALLERY_HELP_CLASS="Задає CSS-клас для блоку галереї та посилань на її зображення. Вкажіть назву класу зі стилів сайту без крапки на початку."
