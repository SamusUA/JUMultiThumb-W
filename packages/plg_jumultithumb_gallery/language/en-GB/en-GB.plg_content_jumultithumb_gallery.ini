PLG_JUMULTITHUMB_GALLERY_HELP_DISPLAY="Controls whether the first image from a gallery is also included in Blog, Category, and other non-Article views. This does not disable the gallery itself in the Article view."
PLG_JUMULTITHUMB_GALLERY_HELP_THUMB_WIDTH="Sets the maximum width, in pixels, for gallery thumbnails. The crop option below determines whether the image is cropped to the requested frame."
PLG_JUMULTITHUMB_GALLERY_HELP_THUMB_HEIGHT="Sets the maximum height, in pixels, for gallery thumbnails. The crop option below determines whether the image is cropped to the requested frame."
PLG_JUMULTITHUMB_GALLERY_HELP_THUMB_CROP="Choose Yes to crop gallery thumbnails to the configured width and height; choose No to preserve the image proportions. The original gallery files are not changed."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER="Select a folder under Joomla's images directory that contains gallery pictures. The gallery tag in the article should point to the intended folder."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER_WIDTH="Sets the maximum width, in pixels, for thumbnails generated from the selected gallery folder. Use a value that fits the site's gallery layout."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER_HEIGHT="Sets the maximum height, in pixels, for thumbnails generated from the selected gallery folder. Use a value that fits the site's gallery layout."
PLG_JUMULTITHUMB_GALLERY_HELP_FOLDER_CROP="Choose whether folder-gallery thumbnails are cropped to the configured dimensions or keep their source proportions. This affects generated thumbnails, not the gallery source files."
PLG_JUMULTITHUMB_GALLERY_HELP_TITLE="Sets the default title used for generated gallery items when the article's gallery tag does not specify one. A title can be supplied per gallery tag to override this default."
PLG_JUMULTITHUMB_GALLERY_HELP_CLASS="Sets the CSS class used on the generated gallery block and its image links. Use a class name defined by your site's stylesheet; do not include a leading dot."